<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>go.luqmannor.com — URL Shortener</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      background: #0a0a0a;
      color: #00ff41;
      min-height: 100vh;
      padding: 2rem;
    }
    .container { max-width: 720px; margin: 0 auto; }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 10px #00ff41;
    }
    .subtitle { color: #666; font-size: 0.8rem; margin-bottom: 2rem; }
    
    /* Login */
    .login-section { margin-bottom: 2rem; }
    .login-section input {
      background: #111;
      border: 1px solid #333;
      color: #00ff41;
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.85rem;
      width: 200px;
      margin-right: 0.5rem;
    }
    .login-section input:focus { outline: none; border-color: #00ff41; }
    
    /* Form */
    .shorten-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .shorten-form input {
      background: #111;
      border: 1px solid #333;
      color: #00ff41;
      padding: 0.6rem 1rem;
      font-family: inherit;
      font-size: 0.85rem;
      flex: 1;
      min-width: 200px;
    }
    .shorten-form input:focus { outline: none; border-color: #00ff41; }
    .shorten-form input::placeholder { color: #444; }
    
    button {
      background: #00ff41;
      color: #0a0a0a;
      border: none;
      padding: 0.6rem 1.2rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #00cc33; box-shadow: 0 0 10px #00ff41; }
    button:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }
    button.danger { background: #ff4141; }
    button.danger:hover { background: #cc3333; box-shadow: 0 0 10px #ff4141; }
    
    /* Links table */
    .links { margin-top: 1rem; }
    .link-item {
      border: 1px solid #222;
      padding: 0.8rem 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .link-item:hover { border-color: #333; }
    .link-info { flex: 1; min-width: 200px; }
    .link-short {
      color: #00ff41;
      font-weight: bold;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .link-short:hover { text-decoration: underline; }
    .link-target {
      color: #888;
      font-size: 0.75rem;
      word-break: break-all;
      margin-top: 0.2rem;
    }
    .link-stats {
      color: #555;
      font-size: 0.7rem;
      margin-top: 0.2rem;
    }
    .link-actions { display: flex; gap: 0.3rem; }
    .link-actions button { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
    
    .message {
      padding: 0.5rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.8rem;
      border: 1px solid;
    }
    .message.success { border-color: #00ff41; color: #00ff41; }
    .message.error { border-color: #ff4141; color: #ff4141; }
    
    .empty { color: #444; font-size: 0.85rem; padding: 2rem; text-align: center; }
    
    @media (max-width: 600px) {
      body { padding: 1rem; }
      .shorten-form { flex-direction: column; }
      .link-item { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>go/</h1>
    <p class="subtitle">go.luqmannor.com — URL shortener</p>
    
    <div class="login-section" id="loginSection">
      <input type="password" id="password" placeholder="admin password" />
      <button onclick="login()">login</button>
    </div>
    
    <div id="app" style="display:none;">
      <div id="message"></div>
      
      <form class="shorten-form" onsubmit="shorten(event)">
        <input type="url" id="urlInput" placeholder="https://example.com/long-url" required />
        <input type="text" id="slugInput" placeholder="custom-slug (optional)" pattern="[a-z0-9\-]+" />
        <button type="submit">shorten</button>
      </form>
      
      <div class="links" id="links">
        <div class="empty">loading...</div>
      </div>
    </div>
  </div>

  <script>
    const API = 'https://url-shortener.hakimnoralahyadi.workers.dev';
    let token = localStorage.getItem('go_token') || '';

    if (token) {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadLinks();
    }

    function login() {
      token = document.getElementById('password').value;
      localStorage.setItem('go_token', token);
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadLinks();
    }

    function showMessage(text, type = 'success') {
      const el = document.getElementById('message');
      el.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => el.innerHTML = '', 4000);
    }

    async function shorten(e) {
      e.preventDefault();
      const url = document.getElementById('urlInput').value;
      const slug = document.getElementById('slugInput').value;
      
      try {
        const res = await fetch(`${API}/api/shorten`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ url, slug: slug || undefined }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        
        showMessage(`created: <a href="${data.shortUrl}" class="link-short" target="_blank">${data.shortUrl}</a>`);
        document.getElementById('urlInput').value = '';
        document.getElementById('slugInput').value = '';
        loadLinks();
      } catch (err) {
        showMessage(err.message, 'error');
      }
    }

    async function loadLinks() {
      try {
        const res = await fetch(`${API}/api/links`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });
        if (!res.ok) {
          if (res.status === 401) {
            showMessage('Invalid password', 'error');
            localStorage.removeItem('go_token');
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('app').style.display = 'none';
            return;
          }
          throw new Error('Failed to load');
        }
        const data = await res.json();
        renderLinks(data.links);
      } catch (err) {
        document.getElementById('links').innerHTML = `<div class="empty">${err.message}</div>`;
      }
    }

    function renderLinks(links) {
      if (!links.length) {
        document.getElementById('links').innerHTML = '<div class="empty">no links yet — create one above</div>';
        return;
      }
      document.getElementById('links').innerHTML = links.map(link => `
        <div class="link-item">
          <div class="link-info">
            <a href="https://go.luqmannor.com/${link.slug}" class="link-short" target="_blank">go.luqmannor.com/${link.slug}</a>
            <div class="link-target">${link.url}</div>
            <div class="link-stats">${link.clicks} clicks · created ${new Date(link.created).toLocaleDateString()}</div>
          </div>
          <div class="link-actions">
            <button onclick="copyLink('${link.slug}')">copy</button>
            <button class="danger" onclick="deleteLink('${link.slug}')">del</button>
          </div>
        </div>
      `).join('');
    }

    function copyLink(slug) {
      navigator.clipboard.writeText(`https://go.luqmannor.com/${slug}`);
      showMessage('copied to clipboard');
    }

    async function deleteLink(slug) {
      if (!confirm(`Delete /${slug}?`)) return;
      await fetch(`${API}/api/links/${slug}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` },
      });
      loadLinks();
    }
  </script>
</body>
</html>
